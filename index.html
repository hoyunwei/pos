  noteEl.textContent = '請把網址開頭改成 https:// 再開一次。';
}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock() {
  const pw = pwEl.value;
  if (!pw) return;
  goEl.disabled = true;
  msgEl.style.color = '#6b6258';
  msgEl.textContent = '解密中…';
  try {
    const km = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: 'SHA-256' },
      km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
    const html = new TextDecoder().decode(plain);
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    goEl.disabled = false;
    msgEl.style.color = '#b3402e';
    msgEl.textContent = '密碼不對';
    pwEl.value = '';
    pwEl.focus();
  }
}

goEl.addEventListener('click', unlock);
pwEl.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
</script>
